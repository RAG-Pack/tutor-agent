[project]
name = "tutor-agent"
version = "0.1.0"
description = "A course tutor for RAG Pack's Introduction to Agents: Session 3's TinyAgent with a TUTOR.md, skills, lecture video search and a Gradio chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5",
    "numpy",
]

[project.scripts]
tutor = "tutor.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutor"]
